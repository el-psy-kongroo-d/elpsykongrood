<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="page(title, content, activePage)" lang="ko">
<head th:replace="~{fragments/head :: head(${title}, ${activePage})}"></head>
<body>
<div class="page">
    <a class="skip" href="#main" th:text="#{layout.skip}">본문으로 건너뛰기</a>
    <header th:replace="~{fragments/header :: header(${activePage})}"></header>
    <main id="main" class="main"><th:block th:replace="${content}"></th:block></main>
    <footer th:replace="~{fragments/footer :: footer}"></footer>
</div>
</body>
</html>
